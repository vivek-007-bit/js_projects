<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/spotify-16.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/responsive.css">
    <title>Spotify - Web Player: Music For Everyone</title>
</head>

<body>
    <div class="container  flex bg-black">
        <div class="left">
            <div class="home bg-grey rounded m-1 p-1">
                <div class="close-btn">
                    <img class="invert" src="assets/cross-icon.svg" alt="close-icon">
                </div>
                <div class="logo flex"><img src="assets/logo.png" alt="logo">Spotify</div>
                <ul>
                    <li><img class="invert" src="assets/home.svg" alt="home">Home</li>
                    <li><img class="invert" src="assets/search.svg" alt="search">Search</li>
                </ul>
            </div>
            <div class="library bg-grey rounded m-1 p-1">
                <div class="heading">
                    <img class="invert" src="assets/library.svg" alt="Library" width="15px">
                    <h2>Your Library</h2><img class="invert" src="assets/search.svg" alt="search">
                </div>
                <div class="song-list">
                    <ul>

                    </ul>
                </div>
                <div class="footer">
                    <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>
                    <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>
                    <div><a href="https://www.spotify.com/jp/privacy-policy/"><span>Privacy Policy</span></a></div>
                    <div><a href="https://www.spotify.com/jp/cookies-policy/"><span>Cookies</span></a></div>
                    <div><a href="https://www.spotify.com/jp/privacy-policy/"><span>About Us</span></a></div>
                    <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>
                </div>
            </div>
        </div>
        <div class="right bg-grey rounded">
            <div class="header rounded">
                <div class="nav">
                    <img class="invert hamburger" src="assets/bars-solid.svg" alt="hamburger-icon">
                    <img class="invert" src="assets/angle-left-solid.svg" alt="angle-left">
                    <img class="invert" src="assets/angle-right-solid.svg" alt="angle-right">
                </div>
                <div class="buttons">
                    <button class="signup-btn">
                        <a href="signup.html">Sign Up</a>
                    </button>
                    <button class="login-btn">
                        <a href="login.html" style="color: black;">Log in</a>
                    </button>
                </div>
            </div>
            <div class="spotify-playlist">
                <h1>Spotify Playlists</h1>
                <div class="card-container">

                </div>
            </div>
            <div class="play-bar">
                <div class="above-bar">
                    <div class="song-title">
                        <img src="assets/playing.gif" alt="songCover" class="songCover">
                        <div class="song-info">

                        </div>
                    </div>

                    <div class="song-controls">

                        <div class="volume">
                            <img src="assets/volume.svg" alt="volume" class="volume-icon">
                            <input type="range" name="volume-bar" class="volume-bar" min="0" max="100" value="45">
                        </div>
                        <div class="song-buttons">
                            <img id="shuffle"  src="assets/shuffle.svg" alt="shuffle-song">
                            <img id="previous" src="assets/previous-music.svg" alt="previous-song">
                            <img id="play" src="assets/play-button.svg" alt="play">
                            <img id="next" src="assets/next-music.svg" alt="next-song">
                            <img id="repeatOne" src="assets/repeat-one.svg" alt="repeat-one">
                        </div>

                        <div class="song-time">
                        </div>





                    </div>

                </div>

                <div class="seek-bar">
                    <div class="circle">

                    </div>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
        <script src="js/shortcuts.js"></script>

</body>

</html>
