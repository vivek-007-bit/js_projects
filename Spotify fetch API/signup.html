<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Signup</title>
    <link rel="icon" type="image/png" href="assets/spotify-16.png">
    <style>

        .invert {
            filter: invert(1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(25, 23, 23);
        }

        .container {
            background-color: black;
            max-width: 600px;
            margin: auto;
            margin-top: 10px;
            border-radius: 5px;
            padding: 15px 50px;
        }

        .header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .header img {
            width: 45px;
        }

        .header h1 {
            color: white;
            font-weight: 800;
        }

        .shortcut {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .shortcut a {
            display: flex;
            align-items: center;
        }

        .shortcut a img {
            width: 25px;
        }

        .shortcut .login-btn {
            text-decoration: none;
            color: white;
            background-color: rgba(27, 26, 26, 0.893);
            width: 300px;
            padding: 15px 10px;
            border: solid rgb(221, 219, 219) 1px;
            border-radius: 30px;
            font-weight: 800;
            display: flex;
            justify-content: space-around;
        }

        .separator {
            width: 100%;
            height: 0.4px;
            background-color: rgba(134, 120, 120, 0.896);
            margin: 35px 0;
        }

        .box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .box label {
            color: white;
            font-weight: 800;
            margin: 3px 0;
        }

        .box a {
            margin: 5px 0;
            color: rgb(82, 235, 82);
        }

        .box input {
            height: 45px;
            width: 290px;
            padding: 9px;
            border: solid rgb(133, 127, 127) 1px;
            border-radius: 2px;
            background-color: rgba(27, 26, 26, 0.893);
            appearance: none;
            outline: none;
            color: white;
            font-weight: 900;
            font-family: 'Times New Roman', Times, serif;
        }

        .box input::placeholder {
            color: rgba(173, 164, 164, 0.907);
            font-family: 'Times New Roman', Times, serif;
        }

        .btn-green {
            margin: 15px 0;
            height: 45px;
            width: 290px;
            color: black;
            font-weight: 700;
            border-radius: 30px;
            background-color: rgb(82, 235, 82);
        }

        .endnote {
            color: rgb(193, 186, 186);
        }


        .endnote a {
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <img src="assets/logo.png" alt="logo">
            <h1>Sign up to start listening</h1>
        </div>

        <form action="#" class="box">
            <label for="Email">Email address</label>
            <input type="text" placeholder="name@domain.com">
            <a href="#">Use phone number instead</a>
            <button class="btn-green">Next</button>
        </form>

        <div class="separator">
        </div>



        <div class="shortcut">
            <a href="#" class="login-btn"><img src="assets/google-icon.svg" alt="google">Continue with Google</a>
            <a href="#" class="login-btn"><img src="assets/facebook-logo.svg" alt="facebook">Continue with Facebook</a>
            <a href="#" class="login-btn"><img src="assets/apple-logo.svg" alt="apple" class="invert">Continue with Apple</a>
            <a href="#" class="login-btn">Continue with phone Number</a>

            <div class="separator">
            </div>

            <span class="endnote">Already have an account? <a href="login.html">Log in here</a></span>
        </div>


    </div>
</body>

</html>
