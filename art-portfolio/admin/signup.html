<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Signup</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-body-tertiary d-flex align-items-center justify-content-center vh-100">

  <div class="card border rounded-4 shadow-sm p-4" style="width: 400px;">

    <div class="text-center mb-4">
      <h2 class="fw-bold">Create Account</h2>
      <p class="text-secondary">Signup to continue</p>
    </div>

    <form id="signupForm">

      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="fullName" placeholder="Full Name" required />
        <label for="fullName">Full Name</label>
      </div>

      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="signupEmail" placeholder="name@example.com" required />
        <label for="signupEmail">Email address</label>
      </div>

      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="signupPassword" placeholder="Password" required />
        <label for="signupPassword">Password</label>
      </div>

      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required />
        <label for="confirmPassword">Confirm Password</label>
      </div>

      <button type="submit" class="btn btn-success w-100 py-2">
        Create Account
      </button>

    </form>

    <p class="text-center mt-4 mb-0">
      Already have an account?
      <a href="login.html" class="text-decoration-none">Login</a>
    </p>

  </div>
  <script src="js/signup.js"></script>
</body>

</html>
