<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-body-tertiary d-flex align-items-center justify-content-center vh-100">

  <div class="card border rounded-4 shadow-sm p-4" style="width: 400px;">

    <div class="text-center mb-4">
      <h2 class="fw-bold">Login</h2>
      <p class="text-secondary">Sign in to your account</p>
    </div>

    <form id="loginForm">

      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com" />
        <label for="loginEmail">Email address</label>
      </div>

      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="loginPassword" placeholder="Password" />
        <label for="loginPassword">Password</label>
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="rememberMe" />
        <label class="form-check-label" for="rememberMe">
          Remember me
        </label>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2">
        Login
      </button>

    </form>

    <p class="text-center mt-4 mb-0">
      Don't have an account?
      <a href="signup.html" class="text-decoration-none">Signup</a>
    </p>

  </div>
  <script src="js/login.js"></script>
</body>

</html>
