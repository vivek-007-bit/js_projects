<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Artwork Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>

  <!-- Navbar -->
  <header class="navbar navbar-dark sticky-top bg-dark shadow px-3">

    <a class="navbar-brand fw-bold" href="#">
      Art Dashboard
    </a>

    <ul class="nav">

      <li class="nav-item">
        <a href="#" class="nav-link text-white">
          Add Artwork
        </a>
      </li>

      <li class="nav-item">
        <a href="#" class="nav-link text-white">
          Update Artwork
        </a>
      </li>

    </ul>

    <div class="text-white">
      Welcome,
      <span class="fw-semibold">
        admin@example.com
      </span>
    </div>

  </header>

  <div class="container-fluid">

    <div class="row">

      <!-- Sidebar -->
      <div class="col-md-3 col-lg-2 bg-body-tertiary border-end min-vh-100">

        <div class="p-3">

          <h5 class="mb-4">Menu</h5>

          <ul class="nav flex-column gap-2">

            <li class="nav-item">
              <a href="#" class="nav-link active">
                Dashboard
              </a>
            </li>

            <li class="nav-item">
              <a href="#" class="nav-link">
                Add Artwork
              </a>
            </li>

            <li class="nav-item">
              <a href="#" class="nav-link">
                Update Artwork
              </a>
            </li>

            <li class="nav-item">
              <button class="nav-link text-danger border-0 bg-transparent" onclick="logout()">
                Logout
              </button>
            </li>

          </ul>

        </div>

      </div>

      <!-- Main Content -->
      <main class="col-md-9 col-lg-10 p-4">

        <div class="border rounded-4 bg-body-tertiary p-5">

          <h2 class="mb-3">
            Dashboard
          </h2>

          <p class="text-secondary">
            Your future dashboard content will appear here.
          </p>

          <!-- Future Content Area -->
          <div class="border rounded-4 bg-white p-5 mt-4 text-center">

            <h4 class="text-secondary">
              Empty Content Area
            </h4>

            <p class="text-muted mb-0">
              Add tables, cards, artwork listings, analytics, or forms later.
            </p>

          </div>

        </div>

      </main>

    </div>

  </div>

  <script src="js/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
